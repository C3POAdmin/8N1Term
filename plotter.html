<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>8N1Term Data Plotter</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d1117;
    color: #c9d1d9;
    height: 100%;
    width: 100%;
	overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #plotter {
    height: 100%;
    width: 100%;
  }
</style>
</head>
<body>

<div id="plotter"></div>

<script type="module">
  import ApexCharts from 'apexcharts'
  import { listen } from '@tauri-apps/api/event'

  const MAX_POINTS = 300

  const seriesData = []

  const options = {
    chart: {
      type: 'line',
      height: '100%',
      width: '100%',
      animations: {
        enabled: true,
        easing: 'linear',
        speed: 150
      },
      background: 'transparent',
	  parentHeightOffset: 0, 
      toolbar: { show: false },
      zoom: { enabled: false }
    },

    theme: {
      mode: 'dark'
    },

	stroke: {
	    curve: 'straight',
		width: 2
	},

    grid: {
      borderColor: '#1f2937',
      strokeDashArray: 3
    },

    xaxis: {
      type: 'datetime',
      labels: {
        style: { colors: '#8b949e' }
      }
    },

    yaxis: {
      decimalsInFloat: 2,
      labels: {
        style: { colors: '#8b949e' }
      }
    },

	tooltip: {
	  theme: 'dark',
	  custom: function({ series, seriesIndex, dataPointIndex, w }) {
		const p = w.config.series[seriesIndex].data[dataPointIndex]
		const d = new Date(p.t)

		const hh = String(d.getHours()).padStart(2,'0')
		const mm = String(d.getMinutes()).padStart(2,'0')
		const ss = String(d.getSeconds()).padStart(2,'0')
		const ms = String(d.getMilliseconds()).padStart(3,'0')

		const time = `${hh}:${mm}:${ss}.${ms}`
		const val  = series[seriesIndex][dataPointIndex]

		return `
		  <div style="padding:6px 8px;">
			<div>${time}</div>
			<div>${val}</div>
		  </div>
		`
	  }
	},

    series: [{
      name: 'Value',
      data: seriesData
    }]
  }

  const plotter = new ApexCharts(document.querySelector('#plotter'), options)
  plotter.render()

	let token = ''
	let xIndex = 0

	await listen('serial_rx', (event) => {
	  let emit = false
	  const packet = event.payload   // Uint8Array or number[]

		packet.forEach((b) => {
		  // Allowed token chars: '0'..'9', '.', '-'
		  const isDigit = (b >= 48 && b <= 57)
		  const isDot   = (b === 46) // '.'
		  const isMinus = (b === 45) // '-'

		  if (isDigit || isDot || isMinus) {
			token += String.fromCharCode(b)
			return
		  }

		  // ---- delimiter reached: process current token (if any) ----
		  if (!token.length) return

		  // State: scan token for rule checks (no regex)
		  let dotCount = 0
		  let minusCount = 0
		  let minusPos = -1

		  for (let i = 0; i < token.length; i++) {
			const c = token.charCodeAt(i)

			if (c === 46) {               // '.'
			  dotCount++
			  // REJECT: more than one dot => likely IP/phone-ish or junk
			  if (dotCount > 1) { token = ''; return }
			} else if (c === 45) {        // '-'
			  minusCount++
			  if (minusPos === -1) minusPos = i
			  // REJECT: more than one minus
			  if (minusCount > 1) { token = ''; return }
			} else if (c >= 48 && c <= 57) {
			  // digit OK
			} else {
			  // REJECT: should never happen due to tokenization rule,
			  // but keeps the logic airtight.
			  token = ''
			  return
			}
		  }

		  // REJECT: minus present but not at start (e.g. "12-3")
		  if (minusCount === 1 && minusPos !== 0) { token = ''; return }

		  // REJECT: degenerate / not-a-number shaped tokens
		  // "-", ".", "-."
		  if (
			token === '-' ||
			token === '.' ||
			token === '-.' ||
			token === ''
		  ) { token = ''; return }

		  // ACCEPT/REJECT: numeric conversion and range checks
		  const y = Number(token)

		  // REJECT: not finite (NaN/Infinity)
		  if (!Number.isFinite(y)) { token = ''; return }

		  // ACCEPT: push sample
		  seriesData.push({
			x: xIndex++,
			y,
			t: Date.now()
		  })
		  emit = true

		  // Reset token for next parse
		  token = ''
		})
	  })

	  // packet boundary acts as delimiter
	  if (token.length) {
		const y = Number(token)

		if (Number.isFinite(y) && y < 1000) {
		  seriesData.push({
			x: xIndex++,
			y,
			t: Date.now()
		  })
		  emit = true
		}

		token = ''
	  }

	  if (emit) {
		plotter.updateSeries([{ data: seriesData }], false)
	  }
})


</script>

</body>
</html>
