<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>8N1Term History</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
	html, body {
		margin: 0;
		padding: 0;
		background: #0d1117;
		color: #c9d1d9;
		height: 100%;
		width: 100%;
		overflow: hidden;
		font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
	}

	#plotter {
		height: 100%;
		width: 100%;
	}

	#filter {
		position:absolute;
		right:10px;
		top:10px;
	}
	.text {
		float:left;
		margin-right:10px;
		margin-top:-2px;
	}
	#min {
		float:left;
		margin-right:10px;
	}
	#max {
		float:left;
	}
  
	.ft-input {
		width: 80px;
		padding: 2px 6px;
		font-size: 13px;
		border: 2px solid rgba(148, 163, 184, 0.45);
		background: rgba(2, 6, 23, 0.6);
		color: #e5e7eb;
		border-radius: 8px;
	}

	.ft-input:hover {
		border-color: rgba(148, 163, 184, 0.65);
		background: rgba(2, 6, 23, 0.75);
	}

	.ft-input:active {
		transform: translateY(1px);
		border-color: rgba(148, 163, 184, 1);
	}
</style>
</head>
<body>

<div id="plotter"></div>

<div id="filter">
	<div class="text">Filter:</div>
	<input id="min" class="ft-input" placeholder="min" value="-10000">
	<input id="max" class="ft-input" placeholder="max" value="10000">
</div>

<script type="module">
import { listen } from '@tauri-apps/api/event'

async function historyTX() {
  let result = await Swal.fire({
    title: "History",
    html:` 
	  <div class="ft-wrap" style="padding-bottom:2px" role="table" id="select_history"></div>
	  <div style="margin-top:5px;margin-left:-10px" id="auto-send-outer"></div>
	`,
    showConfirmButton: true,
    allowOutsideClick: true,
    allowEscapeKey: true,
    confirmButtonText: "Close",

    background: "#0b1220",
    color: "#e5e7eb",
    width: 730,
    customClass: {
      popup: "ft-swal",
      title: "ft-title",
      htmlContainer: "ft-html",
    },
    didOpen: () => {
		const el = document.querySelector("#auto-send-outer");
		const tog_auto_history = createToggle({
		  label: "Auto Send",
		  initial: auto_history,
		  onChange: (label, state) => {
			console.log(label, state);
			auto_history = state;
		  }
		});
		el.appendChild(tog_auto_history);

		renderHistory();
		handleHistory();
	}
  });
}

function renderHistory() {
  const el = document.querySelector("#select_history");
  el.innerHTML = ""; // clear previous content

  const df = document.createDocumentFragment();
  let hasHistory = false;

  for (let i = historyArray.length - 1; i >= 0; i--) {
    const h = historyArray[i];
    if (!h || h.length === 0) continue;

    hasHistory = true;

    const btn = document.createElement("button");
    btn.classList.add("ft-btn", "ft-btn-column");
    btn.type = "button";
    btn.dataset.history = i;

    const frag = renderRX(h, true);
    btn.appendChild(frag);

    df.appendChild(btn);
  }

  if (!hasHistory) {
    const hint = document.createElement("div");
    hint.className = "ft-hint";
    hint.textContent = "No history yet";

	hint.style.textAlign = "center";
	hint.style.width = "98%";
	hint.style.padding = "10px 0";
    el.appendChild(hint);
    return;
  }

  el.appendChild(df);
}

function handleHistory() {
  const root = document.getElementById("select_history");

  root.addEventListener("click", (e) => {
    const btn = e.target.closest(".ft-btn");
    if (!btn) return;

    const idx = Number(btn.dataset.history);
	console.log('History click',historyArray[idx]);
	if(!historyArray[idx])
		return;

	tx_buffer = historyArray[idx].slice(); // shallow copy

	if(auto_history == false) {
		renderTXBytes(tx_buffer);
		return;
	} 

	if(CR) {
		tx_buffer.push(13);
	} 
	if(LF) {
		tx_buffer.push(10);
	}

	sendBytes(tx_buffer);
	clearTX();
  });
}

</script>

</body>
</html>
